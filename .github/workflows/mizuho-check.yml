name: Check Mizuho scraper

on:
  workflow_dispatch:

jobs:
  check-mizuho:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install scraper dependencies
        run: |
          python -m pip install requests beautifulsoup4 playwright
          python -m playwright install chromium
          npm install -g @tiny-fish/cli
      - name: Verify Mizuho PDF collection
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from scrapers.mizuho import scrape

          reports = scrape()
          assert reports, "Mizuho scraper returned no reports"
          assert all(report["Source"] == "Mizuho" for report in reports), "Japan research source unavailable"
          for report in reports:
              path = Path(report["LocalPath"])
              assert path.read_bytes().startswith(b"%PDF"), f"Invalid PDF: {path}"
          print(f"Verified {len(reports)} Mizuho PDFs")
          PY
