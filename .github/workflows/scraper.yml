name: Daily Financial Report Scraper

on:
  schedule:
    # ＸＸＸ Asia/Taipei (UTC+8; GitHub Actions cron uses UTC)
    - cron: '20 3,7,11,15,19,23 * * *'
  workflow_dispatch:

concurrency:
  group: financial-report-hub-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Install remote browser client
        run: npm install -g @tiny-fish/cli

      - name: Run Scraper
        timeout-minutes: 150
        run: python main.py
        env:
          OPENAI_API_KEY: ${{ secrets.AITEST }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}

      - name: Merge PDFs by Source
        run: python merge_pdfs.py

      - name: Build NotebookLM HTML sources
        run: python build_merged_plain_text_html.py

      - name: Check generated PDF sizes
        run: python check_generated_pdf_sizes.py

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/ index.html "all report pdf/" merged_pdfs/ merged_plain_text_html/
          git add build_merged_plain_text_html.py boilerplate_filter.py merge_pdfs.py check_generated_pdf_sizes.py

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update reports and NotebookLM HTML sources"
          git pull --rebase --autostash origin main
          git push

      - name: Verify recent Mizuho Japan reports are available
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta
          from pathlib import Path
          from scrapers.utils import REPORT_WINDOW_DAYS

          reports = json.loads(Path("data/reports.json").read_text(encoding="utf-8"))
          cutoff_date = (date.today() - timedelta(days=REPORT_WINDOW_DAYS)).isoformat()
          mizuho_reports = [
              report for report in reports
              if report.get("Source") == "Mizuho"
              and report.get("Date", "") >= cutoff_date
          ]
          assert mizuho_reports, "No recent or retained Mizuho Japan reports are available."
          latest = max(report.get("Date", "") for report in mizuho_reports)
          print(
              f"Available {len(mizuho_reports)} recent Mizuho Japan research PDFs "
              f"(latest: {latest}; retained reports may be used during source outages)."
          )
          PY

      - name: Upload report list CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-list-${{ github.run_id }}
          path: data/reports.csv
          if-no-files-found: warn
          retention-days: 30
