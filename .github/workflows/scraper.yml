name: Daily Financial Report Scraper

on:
  schedule:
    # 06:00 and 14:00 Asia/Taipei (UTC+8)
    - cron: '0 22,6 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Scraper
        timeout-minutes: 150
        run: python main.py
        env:
          OPENAI_API_KEY: ${{ secrets.AITEST }}

      - name: Merge PDFs by Source
        run: python merge_pdfs.py

      - name: Build NotebookLM HTML sources
        run: python build_merged_plain_text_html.py

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/ index.html "all report pdf/" merged_pdfs/ merged_plain_text_html/
          git add build_merged_plain_text_html.py boilerplate_filter.py

          git commit -m "Auto-update reports and NotebookLM HTML sources" || echo "No changes to commit"
          git push
